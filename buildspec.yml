version: 0.2

env:
  variables:
    ImageName: my-app-image   # Replace with your image name

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 228490194665.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - docker build -t $ImageName -f ./Dockerfile .
  post_build:
    commands:
      - echo Build completed on `date`
      - docker tag $ImageName:latest 228490194665.dkr.ecr.ap-south-1.amazonaws.com/$ImageName:latest
      - docker push 228490194665.dkr.ecr.ap-south-1.amazonaws.com/$ImageName:latest
